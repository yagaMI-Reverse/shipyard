{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "docuchat.serviceAccountName" . }}
  labels:
    {{- include "docuchat.labels" . | nindent 4 }}
# The workload never calls the Kubernetes API, so it gets no token mounted.
automountServiceAccountToken: false
{{- end }}
