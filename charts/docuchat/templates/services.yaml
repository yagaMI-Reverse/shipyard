apiVersion: v1
kind: Service
metadata:
  name: {{ include "docuchat.fullname" . }}-api
  labels:
    {{- include "docuchat.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "docuchat.selectorLabels" (dict "ctx" . "component" "api") | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "docuchat.fullname" . }}-web
  labels:
    {{- include "docuchat.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.web.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "docuchat.selectorLabels" (dict "ctx" . "component" "web") | nindent 4 }}
{{- if .Values.postgres.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "docuchat.postgresHost" . }}
  labels:
    {{- include "docuchat.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  # Headless: the StatefulSet gets stable per-pod DNS instead of a load-balanced
  # virtual IP.
  clusterIP: None
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      protocol: TCP
  selector:
    {{- include "docuchat.selectorLabels" (dict "ctx" . "component" "postgres") | nindent 4 }}
{{- end }}
