apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "docuchat.fullname" . }}-api
  labels:
    {{- include "docuchat.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 5
  # maxUnavailable: 0 is what makes the rolling update non-disruptive: a new
  # pod must pass readiness before an old one is allowed to go away.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "docuchat.selectorLabels" (dict "ctx" . "component" "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "docuchat.labels" . | nindent 8 }}
        app.kubernetes.io/component: api
      annotations:
        # Roll the pods when configuration changes, not just when the image does.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.api.service.port }}"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: {{ include "docuchat.serviceAccountName" . }}
      terminationGracePeriodSeconds: {{ .Values.api.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
        runAsUser: 10001
        runAsGroup: 10001
      # Spread replicas across nodes so losing one node cannot take the whole
      # API down; "ScheduleAnyway" keeps single-node clusters schedulable.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "docuchat.selectorLabels" (dict "ctx" . "component" "api") | nindent 14 }}
      {{- if .Values.postgres.enabled }}
      # Belt and braces: the application also retries on its own, but failing
      # here keeps a pod out of the Ready pool instead of letting it come up
      # believing it has no database.
      initContainers:
        - name: wait-for-db
          image: "{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}"
          imagePullPolicy: {{ .Values.postgres.image.pullPolicy }}
          command:
            - sh
            - -c
            - |
              until pg_isready -h {{ include "docuchat.postgresHost" . }} -p 5432 -U {{ .Values.postgres.auth.username }}; do
                echo "waiting for postgres..."
                sleep 2
              done
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
      {{- end }}
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.api.service.port }}
          envFrom:
            - configMapRef:
                name: {{ include "docuchat.fullname" . }}-config
            - secretRef:
                name: {{ include "docuchat.fullname" . }}-secret
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: APP_VERSION
              value: "{{ .Values.api.image.tag | default .Chart.AppVersion }}"
          # Startup probe guards the slow first index build; liveness only takes
          # over once the app has answered here at least once.
          startupProbe:
            httpGet:
              path: {{ .Values.api.probes.liveness.path }}
              port: http
            periodSeconds: {{ .Values.api.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.api.probes.startup.failureThreshold }}
          # Liveness never touches Postgres — a DB outage must not trigger a
          # cluster-wide restart storm.
          livenessProbe:
            httpGet:
              path: {{ .Values.api.probes.liveness.path }}
              port: http
            periodSeconds: {{ .Values.api.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.api.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.api.probes.liveness.failureThreshold }}
          # Readiness does: an unready pod leaves the Service endpoints but keeps
          # running and rejoins on its own once the dependency recovers.
          readinessProbe:
            httpGet:
              path: {{ .Values.api.probes.readiness.path }}
              port: http
            periodSeconds: {{ .Values.api.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.api.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.api.probes.readiness.failureThreshold }}
            successThreshold: {{ .Values.api.probes.readiness.successThreshold }}
          lifecycle:
            preStop:
              exec:
                # Endpoint removal and pod termination race each other; sleeping
                # here keeps the pod serving until the ingress has stopped
                # sending it new connections.
                command: ["sh", "-c", "sleep {{ .Values.api.preStopSleepSeconds }}"]
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            # readOnlyRootFilesystem is on, so give the process a writable /tmp
            # for uploads and matplotlib/sklearn scratch files.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
