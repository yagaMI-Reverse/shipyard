{{- /*
Demo secret rendered by the chart. Real clusters should source this from
External Secrets / Sealed Secrets / a cloud secret manager instead — see the
README section "Secrets: what I'd do differently in a real cluster".
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "docuchat.fullname" . }}-secret
  labels:
    {{- include "docuchat.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ include "docuchat.databaseUrl" . | quote }}
{{- if .Values.postgres.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "docuchat.fullname" . }}-postgres
  labels:
    {{- include "docuchat.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.postgres.auth.username | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.auth.password | quote }}
  POSTGRES_DB: {{ .Values.postgres.auth.database | quote }}
{{- end }}
