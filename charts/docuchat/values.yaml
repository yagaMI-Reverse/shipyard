# Default values for the DocuChat chart.
# Local kind overrides live in values-local.yaml; CI uses values-ci.yaml.

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""

# --------------------------------------------------------------------------- #
# Backend: FastAPI RAG API
# --------------------------------------------------------------------------- #
api:
  image:
    repository: ghcr.io/yagami-reverse/shipyard-docuchat-api
    tag: ""            # defaults to .Chart.AppVersion
    pullPolicy: IfNotPresent

  replicaCount: 2

  service:
    port: 8000

  # Used only when postgres.enabled=false (e.g. a managed RDS instance).
  externalDatabaseUrl: ""

  env:
    LOG_LEVEL: INFO
    SERVICE_NAME: docuchat-api
    UVICORN_WORKERS: "1"

  # Requests drive both scheduling and the HPA's utilisation maths, so they are
  # deliberately modest: 200m request + 60% target means one pod scales out at
  # roughly 120m of sustained CPU.
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 800m
      memory: 512Mi

  probes:
    # Startup: TF-IDF indexing runs at import, so give the process room to boot
    # before liveness starts counting failures.
    startup:
      periodSeconds: 2
      failureThreshold: 30
    liveness:
      path: /healthz
      initialDelaySeconds: 0
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
    readiness:
      path: /readyz
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 2
      successThreshold: 1

  # Seconds to keep serving after the pod is marked Terminating, so in-flight
  # requests finish and kube-proxy/ingress have time to drop the endpoint.
  preStopSleepSeconds: 5
  terminationGracePeriodSeconds: 30

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 60
    # Scale up fast, scale down calmly — the default 5-minute stabilisation
    # window makes a load test look broken.
    behavior:
      scaleUp:
        stabilizationWindowSeconds: 0
        policies:
          - type: Percent
            value: 100
            periodSeconds: 15
      scaleDown:
        stabilizationWindowSeconds: 60
        policies:
          - type: Percent
            value: 50
            periodSeconds: 30

  podDisruptionBudget:
    enabled: true
    minAvailable: 1

# --------------------------------------------------------------------------- #
# Frontend: React SPA on nginx
# --------------------------------------------------------------------------- #
web:
  image:
    repository: ghcr.io/yagami-reverse/shipyard-docuchat-web
    tag: ""
    pullPolicy: IfNotPresent

  replicaCount: 2

  service:
    port: 8080

  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi

  probes:
    path: /healthz

  preStopSleepSeconds: 5
  terminationGracePeriodSeconds: 30

  podDisruptionBudget:
    enabled: true
    minAvailable: 1

# --------------------------------------------------------------------------- #
# Postgres (pgvector) — document persistence
# --------------------------------------------------------------------------- #
postgres:
  enabled: true
  image:
    repository: pgvector/pgvector
    tag: pg16
    pullPolicy: IfNotPresent
  auth:
    username: docuchat
    # Demo credential. In a real cluster this comes from External Secrets /
    # Sealed Secrets — see README "Secrets: what I'd do differently".
    password: docuchat
    database: docuchat
  persistence:
    size: 1Gi
    storageClass: ""   # "" = cluster default (kind: standard/local-path)
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# --------------------------------------------------------------------------- #
# Ingress (ingress-nginx)
# --------------------------------------------------------------------------- #
ingress:
  enabled: true
  className: nginx
  # *.localtest.me resolves to 127.0.0.1 everywhere — no hosts-file editing.
  host: docuchat.localtest.me
  # SSE streaming from /chat must not be buffered by the proxy.
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
  tls:
    enabled: false
    secretName: ""

# Pod-level hardening applied to every workload in the chart.
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
