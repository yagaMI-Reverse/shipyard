# Static SPA server for the DocuChat frontend pod.
# API traffic never reaches nginx: the Ingress sends /api to the backend
# Service directly, so this config only serves the bundle and its own probe.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed assets are immutable; index.html must never be cached or a rolling
    # update would keep serving a stale bundle referencing deleted chunks.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Liveness/readiness target for the frontend pod itself.
    location = /healthz {
        access_log off;
        add_header Content-Type application/json;
        return 200 '{"status":"ok"}';
    }

    # SPA fallback: any unknown path renders the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
